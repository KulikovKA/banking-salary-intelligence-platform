name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: bsi_test
          POSTGRES_USER: bsi
          POSTGRES_PASSWORD: bsi_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsi -d bsi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      INGESTION_MODE: offline
      DATABASE_URL: postgresql+psycopg://bsi:bsi_ci_only@127.0.0.1:5432/bsi_test
      TEST_DATABASE_URL: postgresql+psycopg://bsi:bsi_ci_only@127.0.0.1:5432/bsi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - run: uv sync --locked
      - run: uv run python tools/validate_docs.py
      - run: uv run ruff check .
      - run: uv run mypy backend/app
      - run: uv run alembic -c backend/alembic.ini upgrade head
      - run: uv run alembic -c backend/alembic.ini check
      - run: uv run pytest backend/tests tools/test_bank_tls_probe.py
      - name: Synthetic document E2E (offline, committed PostgreSQL rows)
        run: uv run python tools/source_recovery_e2e.py --output-root "$RUNNER_TEMP/source-recovery-e2e"
        env:
          PYTHONPATH: backend
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-source-recovery-e2e
          path: ${{ runner.temp }}/source-recovery-e2e/*/result.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
