services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: bsi
      POSTGRES_USER: bsi
      POSTGRES_PASSWORD: bsi_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsi -d bsi"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["local"]

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_ENV: poc
      DATABASE_URL: postgresql+psycopg://bsi:bsi_local_only@db:5432/bsi
      STORAGE_ROOT: /var/lib/bsi
      LLM_MODE: fake
      INGESTION_MODE: offline
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_storage:/var/lib/bsi
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["local"]

volumes:
  postgres_data:
  app_storage:
