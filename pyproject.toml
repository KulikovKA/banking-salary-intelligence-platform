[project]
name = "banking-salary-intelligence-platform"
version = "0.1.0"
description = "Private platform for evidence-backed comparison of public bank salary project offers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "alembic>=1.16,<2.0",
    "pydantic>=2.14,<2.15",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn[standard]>=0.41,<0.42",
    "httpx2>=2.13,<2.14",
    "truststore>=0.10,<0.11",
    "certifi>=2026.7",
    "protego>=0.7,<0.8",
    "cryptography>=44,<49",
    "pdfplumber>=0.11,<0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.20,<1.21",
    "pytest>=9.1,<9.2",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
files = ["backend/app"]

[tool.uv]
package = false
